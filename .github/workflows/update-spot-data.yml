name: Update spot data

on:
  schedule:
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-spot-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch latest spot snapshot
        run: python fetch_spot_prices.py

      - name: Validate generated JSON
        run: python -m json.tool spot_data.json > /dev/null

      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- spot_data.json; then
            echo "No spot data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spot_data.json
          git commit -m "Update daily spot snapshot"
          git push
